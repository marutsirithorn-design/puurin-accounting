<script>
(function () {
'use strict';

/* ================= State ================= */
const S = {
  token: null, user: null, settings: {}, categories: [], payments: ['เงินสด', 'โอน'], payrollTypes: [],
  today: null, page: 'day', date: null, month: null, adminTab: 'categories', payMonth: null,
  day: null, charts: [], spreadsheetUrl: '',
};
const isAdmin = () => S.user && S.user.role === 'admin';

/* ================= Icons ================= */
const sv = p => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
const I = {
  logo: sv('<path d="M5 8h11v9a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M7 4v1M10.5 3v2M14 4v1"/>'),
  day: sv('<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M8 15h3"/>'),
  month: sv('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
  admin: sv('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  user: sv('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
  plus: sv('<path d="M12 5v14M5 12h14"/>'),
  left: sv('<path d="m15 18-6-6 6-6"/>'),
  right: sv('<path d="m9 18 6-6-6-6"/>'),
  x: sv('<path d="M18 6 6 18M6 6l12 12"/>'),
  lock: sv('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),
  income: sv('<path d="M12 19V5M5 12l7-7 7 7"/>'),
  expense: sv('<path d="M12 5v14M19 12l-7 7-7-7"/>'),
  wallet: sv('<path d="M20 7H5a2 2 0 0 1 0-4h13v4"/><path d="M3 5v14a2 2 0 0 0 2 2h15V7"/><circle cx="16" cy="14" r="1.5"/>'),
  receipt: sv('<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/>'),
  print: sv('<path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>'),
  logout: sv('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>'),
  key: sv('<circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3M17 6l3 3M14 9l2 2"/>'),
  check: sv('<rect x="4" y="3" width="16" height="18" rx="2"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/>'),
  sheet: sv('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>'),
};

/* ================= Utils ================= */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (Number(n) || 0).toLocaleString('th-TH', { maximumFractionDigits: 2 });
const signed = n => { n = Number(n) || 0; return '<span class="' + (n < 0 ? 'neg' : n > 0 ? 'pos' : '') + '">' + (n > 0 ? '+' : '') + fmt(n) + '</span>'; };
const MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const DAYS = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const parts = s => s.split('-').map(Number);
const thDate = s => { if (!s) return ''; const p = parts(s); return ('0' + p[2]).slice(-2) + '/' + ('0' + p[1]).slice(-2) + '/' + (p[0] + 543); };
const thDateLong = s => { const p = parts(s); const w = new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay(); return 'วัน' + DAYS[w] + 'ที่ ' + p[2] + ' ' + MONTHS[p[1] - 1] + ' ' + (p[0] + 543); };
const thMonth = s => { const p = parts(s); return MONTHS[p[1] - 1] + ' ' + (p[0] + 543); };
const addDays = (s, n) => { const p = parts(s); return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10); };
const addMonths = (s, n) => { const p = parts(s); return new Date(Date.UTC(p[0], p[1] - 1 + n, 1)).toISOString().slice(0, 7); };
const num = v => { const n = Number(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(n) ? n : 0; };
const payBadge = p => '<span class="badge ' + (p === 'เงินสด' ? 'cash' : 'transfer') + '">' + esc(p) + '</span>';
const chip = (name, color) => '<span class="chip" style="--c:' + esc(color || '#b8bfbb') + '"><i></i>' + esc(name) + '</span>';
/* หัวข้อรายรับเพิ่มเติม */
const incName = id => { const t = (S.incomeTypes || []).find(x => x.id === id); return t ? t.name : 'รายรับอื่น'; };
const extrasText = ex => Object.keys(ex || {}).filter(k => Number(ex[k])).map(k => esc(incName(k)) + ' ' + fmt(ex[k])).join(' · ');
const extraLines = (ex, suffix) => Object.keys(ex || {}).filter(k => Number(ex[k])).map(k => kv(esc(incName(k)) + (suffix || ''), fmt(ex[k]))).join('');
const emptyRow = (cols, text, icon) => '<tr><td colspan="' + cols + '"><div class="empty">' + (icon || '') + esc(text) + '</div></td></tr>';
const initials = n => String(n || '?').trim().charAt(0).toUpperCase();
const COLORS = ['#8fb9dd', '#e79c9c', '#7a6a58', '#b9a3d6', '#9c6b4a', '#5f8f6b', '#f0b48f', '#9fb4bd', '#6c5a9c', '#e8cf7d', '#b0564f', '#c3b3e3', '#e0874f', '#e57fae', '#a9b3b8', '#6fb3a8'];

/* ================= Server call ================= */
let loading = 0;
function setLoading(d) { loading = Math.max(0, loading + d); $('#loader').classList.toggle('hidden', loading === 0); }

function call(action, payload) {
  setLoading(1);
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(r => {
        setLoading(-1);
        if (r && r.ok) return resolve(r.data);
        const msg = r ? r.error : 'เกิดข้อผิดพลาด';
        if (msg === 'AUTH') { sessionLost(); return reject(new Error('กรุณาเข้าสู่ระบบใหม่')); }
        reject(new Error(msg));
      })
      .withFailureHandler(e => { setLoading(-1); reject(new Error(e && e.message ? e.message : 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้')); })
      .api(S.token, action, payload || {});
  });
}

/* ================= Toast / modal ================= */
function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  $('#toast-root').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.3s'; }, 2600);
  setTimeout(() => el.remove(), 3000);
}

function openModal(opts) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = '<div class="modal ' + (opts.wide ? 'wide' : '') + '" role="dialog" aria-modal="true">' +
    '<div class="modal-head"><h3>' + esc(opts.title) + '</h3><button type="button" class="icon-btn" data-close aria-label="ปิด">' + I.x + '</button></div>' +
    '<form class="modal-body" novalidate>' + opts.body + '<button type="submit" hidden></button></form>' +
    '<div class="modal-foot"></div></div>';
  const form = $('form', wrap);
  const foot = $('.modal-foot', wrap);
  const onKey = e => { if (e.key === 'Escape' && $('#modal-root').lastElementChild === wrap) close(); };
  function close() {
    document.removeEventListener('keydown', onKey);
    wrap.classList.add('closing');
    setTimeout(() => wrap.remove(), 150);
  }
  (opts.buttons || []).forEach(b => {
    if (b.spacer) { const sp = document.createElement('div'); sp.className = 'spacer'; foot.appendChild(sp); return; }
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn ' + (b.cls || '');
    btn.textContent = b.text;
    if (b.primary) btn.dataset.primary = '1';
    btn.onclick = async () => {
      if (!b.onClick) return close();
      $$('button', foot).forEach(x => { x.disabled = true; });
      try { await b.onClick(form, close); } catch (err) { toast(err.message, 'error'); }
      finally { $$('button', foot).forEach(x => { x.disabled = false; }); }
    };
    foot.appendChild(btn);
  });
  form.addEventListener('submit', e => { e.preventDefault(); const p = $('[data-primary]', foot); if (p && !p.disabled) p.click(); });
  wrap.addEventListener('mousedown', e => { if (e.target === wrap) close(); });
  $('[data-close]', wrap).onclick = close;
  document.addEventListener('keydown', onKey);
  $('#modal-root').appendChild(wrap);
  if (opts.onOpen) opts.onOpen(form, close);
  const first = $(opts.focus || 'input:not([type=hidden]):not([type=radio]):not([type=checkbox]):not([readonly]),select,textarea', form);
  if (first && window.innerWidth > 600) setTimeout(() => first.focus(), 60);
  return { form: form, close: close };
}

function confirmBox(message, okText, danger) {
  return new Promise(resolve => {
    let done = false;
    const m = openModal({
      title: 'ยืนยัน',
      body: '<p style="margin:0 0 14px">' + esc(message) + '</p>',
      buttons: [
        { text: 'ยกเลิก', onClick: (f, close) => { done = true; resolve(false); close(); } },
        { text: okText || 'ยืนยัน', cls: danger ? 'btn-danger' : 'btn-primary', primary: true, onClick: (f, close) => { done = true; resolve(true); close(); } },
      ],
    });
    const obs = new MutationObserver(() => { if (!document.body.contains(m.form)) { obs.disconnect(); if (!done) resolve(false); } });
    obs.observe($('#modal-root'), { childList: true });
  });
}

function formData(form) {
  const o = {};
  new FormData(form).forEach((v, k) => { o[k] = typeof v === 'string' ? v.trim() : v; });
  $$('input[type=checkbox]', form).forEach(c => { o[c.name] = c.checked; });
  return o;
}

const field = (label, html, cls) => '<div class="field ' + (cls || '') + '"><label>' + label + '</label>' + html + '</div>';
const input = (name, val, attrs) => '<input class="input" name="' + name + '" value="' + esc(val == null ? '' : val) + '" ' + (attrs || '') + '>';
const money = (name, val) => '<input class="input money" name="' + name + '" value="' + (val ? esc(val) : '') + '" inputmode="decimal" placeholder="0" autocomplete="off">';
const select = (name, options, val, attrs) => '<select class="input" name="' + name + '" ' + (attrs || '') + '>' +
  options.map(o => '<option value="' + esc(o.value) + '"' + (String(o.value) === String(val) ? ' selected' : '') + '>' + esc(o.label) + '</option>').join('') + '</select>';
const seg = (name, values, val) => '<div class="seg">' + values.map(v => {
  const value = typeof v === 'object' ? v.value : v; const label = typeof v === 'object' ? v.label : v;
  return '<label><input type="radio" name="' + name + '" value="' + esc(value) + '"' + (value === val ? ' checked' : '') + '><span>' + esc(label) + '</span></label>';
}).join('') + '</div>';
const checkbox = (name, label, checked) => '<label class="check"><input type="checkbox" name="' + name + '"' + (checked ? ' checked' : '') + '> ' + esc(label) + '</label>';
const swatches = (name, val) => '<div class="swatches">' + COLORS.map(c => '<label><input type="radio" name="' + name + '" value="' + c + '"' + (c === val ? ' checked' : '') + '><span style="background:' + c + '"></span></label>').join('') + '</div>';

/* ================= Auth ================= */
function showLogin(msg) {
  $('#app').classList.add('hidden');
  $('#login-view').classList.remove('hidden');
  $('#login-logo').innerHTML = I.logo;
  const err = $('#login-error');
  err.textContent = msg || '';
  err.classList.toggle('hidden', !msg);
  setTimeout(() => $('#lg-user').focus(), 50);
}

function sessionLost() {
  S.token = null;
  store.del('acc_token');
  $('#modal-root').innerHTML = '';
  showLogin('หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบใหม่');
}

$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#lg-btn');
  btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ...';
  try {
    const r = await call('login', { username: $('#lg-user').value, password: $('#lg-pass').value });
    S.token = r.token;
    store.set('acc_token', r.token);
    $('#lg-pass').value = '';
    S.page = 'day';
    await loadBootstrap();
  } catch (err) {
    showLogin(err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
  }
});

async function loadBootstrap() {
  const b = await call('bootstrap');
  S.user = b.user; S.settings = b.settings; S.categories = b.categories; S.payments = b.payments;
  S.payrollTypes = b.payrollTypes; S.today = b.today; S.spreadsheetUrl = b.spreadsheetUrl;
  S.incomeTypes = b.incomeTypes || [];
  S.date = S.date || b.today;
  S.month = S.month || b.today.slice(0, 7);
  S.payMonth = S.payMonth || S.month;
  showApp();
}

async function logout() {
  if (!(await confirmBox('ออกจากระบบใช่ไหม?', 'ออกจากระบบ'))) return;
  try { await call('logout'); } catch (e) {}
  S.token = null; S.user = null;
  store.del('acc_token');
  showLogin();
}

function accountMenu() {
  openModal({
    title: 'บัญชีของฉัน',
    body: '<div style="display:flex;align-items:center;gap:12px;margin-bottom:18px"><div class="avatar" style="width:46px;height:46px;font-size:18px">' + esc(initials(S.user.displayName)) + '</div>' +
      '<div><div style="font-weight:600">' + esc(S.user.displayName) + '</div><div class="muted small">@' + esc(S.user.username) + ' · ' + (isAdmin() ? 'ผู้ดูแลระบบ' : 'พนักงาน') + '</div></div></div>' +
      '<div class="lbl muted small" style="margin-bottom:8px">เปลี่ยนรหัสผ่าน</div>' +
      field('รหัสผ่านเดิม', '<input class="input" type="password" name="oldPassword" autocomplete="current-password">') +
      field('รหัสผ่านใหม่ (อย่างน้อย 6 ตัว)', '<input class="input" type="password" name="newPassword" autocomplete="new-password">') +
      field('ยืนยันรหัสผ่านใหม่', '<input class="input" type="password" name="confirm" autocomplete="new-password">'),
    focus: '[name=oldPassword]',
    buttons: [
      { text: 'ออกจากระบบ', cls: 'btn-danger', onClick: (f, close) => { close(); logout(); } },
      { spacer: true },
      { text: 'เปลี่ยนรหัสผ่าน', cls: 'btn-primary', primary: true, onClick: async (f, close) => {
        const d = formData(f);
        if (!d.oldPassword || !d.newPassword) throw new Error('กรุณากรอกรหัสผ่านให้ครบ');
        if (d.newPassword !== d.confirm) throw new Error('รหัสผ่านใหม่ไม่ตรงกัน');
        await call('changePassword', { oldPassword: d.oldPassword, newPassword: d.newPassword });
        toast('เปลี่ยนรหัสผ่านแล้ว', 'success'); close();
      } },
    ],
  });
}

/* ================= Shell ================= */
const PAGES = [
  { id: 'day', label: 'บันทึกรายวัน', icon: I.day },
  { id: 'month', label: 'สรุปรายเดือน', icon: I.month, admin: true },
  { id: 'admin', label: 'หลังบ้าน', icon: I.admin, admin: true },
];

function showApp() {
  $('#login-view').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#brand-logo').innerHTML = I.logo;
  $('#brand-name').textContent = S.settings.shopName;
  document.title = S.settings.shopName;
  $('#side-user').innerHTML = '<div class="avatar">' + esc(initials(S.user.displayName)) + '</div><div style="min-width:0"><div class="name">' + esc(S.user.displayName) + '</div><div class="role">' + (isAdmin() ? 'ผู้ดูแลระบบ' : 'พนักงาน') + '</div></div>';
  $('#side-user').onclick = accountMenu;
  $('#mobile-user').innerHTML = I.user;
  $('#mobile-user').onclick = accountMenu;
  $('#side-logout').innerHTML = I.logout + '<span>ออกจากระบบ</span>';
  $('#side-logout').onclick = logout;
  $('#mobile-logout').innerHTML = I.logout;
  $('#mobile-logout').onclick = logout;
  const pages = PAGES.filter(p => !p.admin || isAdmin());
  if (!pages.some(p => p.id === S.page)) S.page = 'day';
  const navHtml = pages.map(p => '<button class="nav-btn" data-page="' + p.id + '">' + p.icon + '<span>' + p.label + '</span></button>').join('');
  $('#side-nav').innerHTML = navHtml;
  $('#bottom-nav').innerHTML = navHtml + (pages.length === 1 ? '<button class="nav-btn" data-account>' + I.user + '<span>บัญชี</span></button>' : '');
  $$('[data-page]').forEach(b => { b.onclick = () => go(b.dataset.page); });
  const acc = $('[data-account]');
  if (acc) acc.onclick = accountMenu;
  go(S.page);
}

function go(page) {
  S.page = page;
  $$('[data-page]').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  const p = PAGES.find(x => x.id === page);
  $('#page-title').textContent = p.label;
  $('#page-sub').textContent = '';
  destroyCharts();
  render();
  window.scrollTo(0, 0);
}

async function render() {
  const page = $('#page');
  if (!page.innerHTML.trim()) page.innerHTML = '<div class="page-loading">กำลังโหลด...</div>';
  try {
    if (S.page === 'day') await renderDay();
    else if (S.page === 'month') await renderMonth();
    else if (S.page === 'admin') await renderAdmin();
  } catch (e) {
    if (S.token) page.innerHTML = '<div class="card"><div class="empty">' + esc(e.message) + '<br><br><button class="btn btn-sm" id="retry">ลองใหม่</button></div></div>';
    const r = $('#retry'); if (r) r.onclick = render;
  }
}

/* ================= Daily page ================= */
async function renderDay() {
  const d = await call('getDay', { date: S.date });
  S.date = d.date; S.today = d.today; S.day = d;
  if (d.incomeTypes) S.incomeTypes = d.incomeTypes;
  const s = d.summary;
  const admin = isAdmin();
  $('#page-sub').textContent = thDateLong(d.date);

  const billRows = d.bills.map((b, i) =>
    '<tr class="click" data-bill="' + b.id + '"><td class="idx">' + (i + 1) + '</td>' +
    '<td><b>' + esc(b.tableNo || '-') + '</b>' + (b.note ? '<div class="muted small">' + esc(b.note) + '</div>' : '') + '</td>' +
    '<td class="num hide-sm">' + fmt(b.amount) + (b.concert ? '<div class="small muted">บัตร ' + fmt(b.concert) + '</div>' : '') + (extrasText(b.extras) ? '<div class="small muted">' + extrasText(b.extras) + '</div>' : '') + '</td>' +
    '<td class="num hide-sm">' + (b.discount ? '<span class="neg">−' + fmt(b.discount) + '</span>' : '<span class="muted">0</span>') + '</td>' +
    '<td class="num"><b>' + fmt(b.total) + '</b></td>' +
    '<td>' + payBadge(b.payment) + (b.needApproval ? ' <span class="lock" title="แก้ไขต้องใช้รหัสผู้ดูแลระบบ">' + I.lock + '</span>' : '') + '</td></tr>').join('');

  const expRows = d.expenses.map(e =>
    '<tr class="click" data-exp="' + e.id + '"><td>' + chip(e.categoryName, e.color) + '<div class="small" style="margin-top:2px">' + esc(e.item) + (e.note ? ' <span class="muted">· ' + esc(e.note) + '</span>' : '') + '</div></td>' +
    '<td class="num"><b>' + fmt(e.amount) + '</b></td><td>' + payBadge(e.payment) + (e.needApproval ? ' <span class="lock" title="แก้ไขต้องใช้รหัสผู้ดูแลระบบ">' + I.lock + '</span>' : '') + '</td></tr>').join('') +
    d.payroll.map(p =>
    '<tr><td>' + chip('เงินเดือนพนักงาน', '#8e7cc3') + '<div class="small" style="margin-top:2px">' + esc(p.employeeName) + ' · ' + esc(p.type) + '</div></td>' +
    '<td class="num"><b>' + fmt(p.amount) + '</b></td><td>' + payBadge(p.payment) + '</td></tr>').join('');

  $('#page').innerHTML =

function stat(label, value, hint, color) {
  return '<div class="stat" style="--c:' + color + '"><div class="label">' + label + '</div><div class="value">' + value + '</div>' + (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
}
function kv(k, v, cls) { return '<div class="kv ' + (cls || '') + '"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }

/* ----- Admin approval for staff edits ----- */
function askApproval(actionLabel) {
  return new Promise(resolve => {
    let done = false;
    const m = openModal({
      title: 'ต้องได้รับอนุมัติจากผู้ดูแลระบบ',
      body:
        '<div class="notice" style="margin-bottom:14px">' + I.lock + '<span>' + esc(actionLabel) + ' — ให้ผู้ดูแลระบบใส่รหัสผ่านเพื่ออนุมัติ ระบบจะบันทึกประวัติการแก้ไขไว้</span></div>' +
        field('รหัสผ่านผู้ดูแลระบบ', '<input class="input" type="password" name="adminpw" autocomplete="off" data-lpignore="true">') +
        field('เหตุผลการแก้ไข', input('reason', '', 'placeholder="เช่น กรอกยอดผิด, ลูกค้าเปลี่ยนวิธีชำระ" autocomplete="off"')),
      focus: '[name=adminpw]',
      buttons: [
        { spacer: true },
        { text: 'ยกเลิก', onClick: (f, close) => { done = true; resolve(null); close(); } },
        { text: 'อนุมัติและบันทึก', cls: 'btn-primary', primary: true, onClick: (f, close) => {
          const d = formData(f);
          if (!d.adminpw) throw new Error('กรุณาใส่รหัสผ่านผู้ดูแลระบบ');
          if (!d.reason) throw new Error('กรุณาระบุเหตุผลการแก้ไข');
          done = true; resolve({ password: d.adminpw, reason: d.reason }); close();
        } },
      ],
    });
    const obs = new MutationObserver(() => { if (!document.body.contains(m.form)) { obs.disconnect(); if (!done) resolve(null); } });
    obs.observe($('#modal-root'), { childList: true });
  });
}

// รัน fn(approval) — ขอรหัสผู้ดูแลก่อนถ้าจำเป็น; คืน false ถ้าผู้ใช้ยกเลิก
async function withApproval(needed, label, fn) {
  let approval = null;
  if (needed) { approval = await askApproval(label); if (!approval) return false; }
  try {
    await fn(approval);
  } catch (e) {
    if (e.message !== 'APPROVAL_REQUIRED') throw e;
    approval = await askApproval(label);
    if (!approval) return false;
    await fn(approval);
  }
  return true;
}

  const v0 = rec || { food: '', drink: '', discount: s.billDiscount, carryOverride: '', note: '' };
  const buttons = [];
  if (edit) buttons.push({ text: 'ลบสรุป', cls: 'btn-danger', onClick: async (f, close) => {
    if (!(await confirmBox('ลบสรุปรายวันของ ' + thDate(d.date) + '? (ยอดจะกลับไปใช้ยอดรวมจากบิล)', 'ลบ', true))) return;
    const ok = await withApproval(needed, 'ลบสรุปรายวัน ' + thDate(d.date), approval => call('deleteDaySummary', { date: d.date, approval: approval }));
    if (!ok) return;
    toast('ลบสรุปรายวันแล้ว'); close(); render();
  } });
  buttons.push({ spacer: true }, { text: 'ยกเลิก' }, { text: 'บันทึกสรุป', cls: 'btn-primary', primary: true, onClick: async (f, close) => {
    const v = formData(f);
    if (v.food === '' && v.drink === '') throw new Error('กรุณากรอกค่าอาหารหรือค่าเครื่องดื่ม');
    const summary = { date: d.date, food: num(v.food), drink: num(v.drink), discount: num(v.discount), carryOverride: v.carryOverride === '' ? '' : num(v.carryOverride), note: v.note };
    const ok = await withApproval(needed, (edit ? 'แก้ไข' : 'เพิ่ม') + 'สรุปรายวัน ' + thDate(d.date), approval => call('saveDaySummary', { summary: summary, approval: approval }));
    if (!ok) return;
    toast('บันทึกสรุปรายวันแล้ว', 'success'); close(); render();
  } });
  openModal({
    title: 'สรุปรายวัน · ' + thDate(d.date),
    wide: true,
    body:
      approvalNotice(needed, edit, 'สรุปรายวัน') +
      '<div class="pbox" style="margin-bottom:14px"><div class="t">ยอดจากบิลวันนี้ (' + s.billCount + ' บิล)</div>' +
        '<div class="small">ค่าอาหารและเครื่องดื่ม <b>' + fmt(s.billsGross) + '</b> · ส่วนลด <b>' + fmt(s.billDiscount) + '</b> · บัตรคอนเสิร์ต <b>' + fmt(s.concert) + '</b>' + (s.extrasTotal ? ' · ' + extrasText(s.extras) : '') + ' · รวม <b>' + fmt(s.billsTotal) + '</b></div></div>' +

      '<p class="muted small" style="margin:-6px 0 12px">กรอกค่าอาหาร แล้วระบบเติมค่าเครื่องดื่ม = ยอดจากบิล − ค่าอาหาร ให้อัตโนมัติ (แก้ไขได้)</p>' +
      '<div class="row">' + field('ส่วนลดรวม', money('discount', v0.discount)) +
        field('ยอดยกมาจากเมื่อวาน (ว่าง = อัตโนมัติ ' + fmt(s.carryAuto) + ')', '<input class="input money" name="carryOverride" value="' + esc(v0.carryOverride) + '" inputmode="decimal" placeholder="' + fmt(s.carryAuto) + '" autocomplete="off">') + '</div>' +
      field('หมายเหตุ', input('note', v0.note, 'autocomplete="off"')) +
      '<div class="card-body" style="background:var(--surface-2);border-radius:12px;padding:6px 14px">' +
        kv('ค่าบัตรคอนเสิร์ต (จากบิล)', fmt(s.concert)) +
        extraLines(s.extras, ' (จากบิล)') +
        kv('ยอดรวม', '<b id="ds-sales">0</b>') +

        kv('กำไร/ขาดทุน', '<span id="ds-profit">0</span>') +
        kv('ยอดยกมาจากเมื่อวาน', '<span id="ds-carry">0</span>') +
        kv('ยอดสุทธิ', '<span id="ds-net">0</span>', 'total') +
        '<div id="ds-check" class="small" style="padding:4px 0 8px"></div>' +
      '</div>',

    buttons: buttons,

      let drinkTouched = edit;
      f.drink.addEventListener('input', () => { drinkTouched = true; });
      f.food.addEventListener('input', () => {
        if (!drinkTouched && f.food.value !== '') f.drink.value = Math.max(0, Math.round((s.billsGross - num(f.food.value)) * 100) / 100) || '';
      });
      const upd = () => {
        const v = formData(f);
        const sales = num(v.food) + num(v.drink) - num(v.discount) + s.concert + (s.extrasTotal || 0);
        const profit = sales - s.expense;
        const carry = v.carryOverride === '' ? s.carryAuto : num(v.carryOverride);
        $('#ds-sales').textContent = fmt(sales);
        $('#ds-profit').innerHTML = signed(profit);
        $('#ds-carry').innerHTML = signed(carry);
        $('#ds-net').innerHTML = signed(carry + profit);
        const gd = Math.round((num(v.food) + num(v.drink) - s.billsGross) * 100) / 100;
        $('#ds-check').innerHTML = (v.food === '' && v.drink === '') ? '' : gd === 0

      };
      f.addEventListener('input', upd); upd();
    },
  });
}

function billModal(b) {
  const edit = !!b;
  b = b || { payment: S.payments[0] };
  const extraTypes = (S.incomeTypes || []).filter(t => t.active || Number((b.extras || {})[t.id]));
  const needed = edit ? !!b.needApproval : !!S.day.addNeedApproval;
  const buttons = [];
  if (edit) buttons.push({ text: 'ลบ', cls: 'btn-danger', onClick: async (f, close) => {
    if (!(await confirmBox('ลบบิลโต๊ะ ' + (b.tableNo || '-') + ' ยอด ' + fmt(b.total) + ' บาท?', 'ลบ', true))) return;
    const ok = await withApproval(needed, 'ลบบิลโต๊ะ ' + (b.tableNo || '-'), approval => call('deleteBill', { id: b.id, approval: approval }));
    if (!ok) return;
    toast('ลบบิลแล้ว'); close(); render();
  } });
  buttons.push({ spacer: true });
  const save = async (f, close, again) => {
    const d = formData(f);

    if (again) billModal();

  if (!edit) buttons.push({ text: 'บันทึก + เพิ่มต่อ', onClick: (f, c) => save(f, c, true) });
  buttons.push({ text: 'บันทึก', cls: 'btn-primary', primary: true, onClick: (f, c) => save(f, c, false) });

    title: edit ? 'แก้ไขบิล' : 'เพิ่มบิลใหม่',

      approvalNotice(needed, edit, 'บิล') +
      '<div class="live-total"><span>ยอดรวมบิล</span><b id="bill-total">0</b></div>' +

      field('ค่าอาหารและเครื่องดื่ม', money('amount', b.amount)) +
      (extraTypes.length ? '<div class="row">' + extraTypes.map(t => field(esc(t.name) + (t.active ? '' : ' <span class="badge off">ปิดใช้งาน</span>'), money('ex_' + t.id, (b.extras || {})[t.id]))).join('') + '</div>' : '') +
      '<div class="row">' + field('ส่วนลด/คืนเงิน', money('discount', b.discount)) + field('ค่าบัตรคอนเสิร์ต', money('concert', b.concert)) + '</div>' +
      field('ช่องทางชำระ', seg('payment', S.payments, b.payment)) +
      field('หมายเหตุ', input('note', b.note, 'autocomplete="off"')) +
      (edit ? editedNote(b) : ''),
    buttons: buttons,
    onOpen: f => {
      const upd = () => { const d = formData(f); const ex = extraTypes.reduce((a, t) => a + num(d['ex_' + t.id]), 0); $('#bill-total').textContent = fmt(num(d.amount) + num(d.concert) + ex - num(d.discount)); };
      f.addEventListener('input', upd); upd();
    },
  });
}

function expenseModal(e) {
  const edit = !!e;
  e = e || { payment: S.payments[0], categoryId: '' };
  const needed = edit ? !!e.needApproval : !!S.day.addNeedApproval;
  const cats = S.categories.slice();
  if (edit && !cats.some(c => c.id === e.categoryId)) cats.push({ id: e.categoryId, name: e.categoryName });
  const buttons = [];
  if (edit) buttons.push({ text: 'ลบ', cls: 'btn-danger', onClick: async (f, close) => {
    if (!(await confirmBox('ลบรายจ่าย “' + e.item + '” ' + fmt(e.amount) + ' บาท?', 'ลบ', true))) return;
    const ok = await withApproval(needed, 'ลบรายจ่าย “' + e.item + '”', approval => call('deleteExpense', { id: e.id, approval: approval }));
    if (!ok) return;
    toast('ลบรายการแล้ว'); close(); render();
  } });
  buttons.push({ spacer: true });
  const save = async (f, close, again) => {
    const d = formData(f);
    if (!d.categoryId) throw new Error('กรุณาเลือกหมวดรายจ่าย');
    const expense = { id: e.id, date: S.date, categoryId: d.categoryId, item: d.item, amount: num(d.amount), payment: d.payment, note: d.note };
    const label = edit ? 'แก้ไขรายจ่าย “' + e.item + '”' : 'เพิ่มรายจ่ายย้อนหลังวันที่ ' + thDate(S.date);
    const ok = await withApproval(needed, label, approval => call('saveExpense', { expense: expense, approval: approval }));
    if (!ok) return;
    toast(edit ? 'แก้ไขรายจ่ายแล้ว' : 'บันทึกรายจ่ายแล้ว', 'success');
    close(); await render();
    if (again) expenseModal();
  };
  if (!edit) buttons.push({ text: 'บันทึก + เพิ่มต่อ', onClick: (f, c) => save(f, c, true) });
  buttons.push({ text: 'บันทึก', cls: 'btn-primary', primary: true, onClick: (f, c) => save(f, c, false) });
  openModal({
    title: edit ? 'แก้ไขรายจ่าย' : 'เพิ่มรายจ่าย',
    body:
      approvalNotice(needed, edit, 'รายการ') +
      field('หมวดรายจ่าย', select('categoryId', [{ value: '', label: '— เลือกหมวด —' }].concat(cats.map(c => ({ value: c.id, label: c.name }))), e.categoryId)) +
      field('รายการ', input('item', e.item, 'placeholder="ว่างไว้ = ใช้ชื่อหมวด" autocomplete="off"')) +
      field('จำนวนเงิน', money('amount', e.amount)) +
      field('ช่องทางชำระ', seg('payment', S.payments, e.payment)) +
      field('หมายเหตุ', input('note', e.note, 'autocomplete="off"')) +
      (edit ? editedNote(e) : ''),
    buttons: buttons,
  });
}

    focus: '[name=countedCash]',
    buttons: [
      { spacer: true },

/* ----- Excel export (สรุปรายเดือน) ----- */
function exportMonthExcel(m) {
  if (typeof XLSX === 'undefined') throw new Error('โหลดตัวสร้างไฟล์ Excel ไม่สำเร็จ กรุณารีเฟรชหน้าแล้วลองใหม่');
  const t = m.totals;
  const shop = S.settings.shopName || 'ร้าน';
  const NUMFMT = '#,##0.00;[Red](#,##0.00)';
  const sheet = (aoa, cols, merges) => {
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    Object.keys(ws).forEach(k => { if (k[0] !== '!' && ws[k].t === 'n') ws[k].z = NUMFMT; });
    ws['!cols'] = cols.map(w => ({ wch: w }));
    if (merges) ws['!merges'] = merges;
    return ws;
  };

  // 1) ตารางรายวัน
  const incCols = m.incomeTypes || [];
  const head = ['วันที่', 'อาหาร', 'เครื่องดื่ม', 'ส่วนลด', 'ค่าบัตรคอนเสิร์ต'].concat(incCols.map(x => x.name), ['ยอดขายสุทธิ', 'ค่าใช้จ่ายรายวัน', 'กำไรรายวัน', 'ยอดยกมา', 'ยอดสุทธิ', 'จำนวนบิล', 'สถานะ']);
  const rows = m.daily.map(r => [
    thDate(r.date), r.summarized ? r.food : null, r.summarized ? r.drink : null, r.discount, r.concert].concat(incCols.map(x => r.extras[x.id] || 0), [
    r.sales, r.expense, r.profit, r.carry, r.net, r.billCount,
    r.summarized ? 'สรุปแล้ว' : (r.billCount ? 'รอสรุปรายวัน' : ''),
  ]));
  const foot = ['รวมยอด', t.food, t.drink, t.discount, t.concert].concat(incCols.map(x => t.extras[x.id] || 0), [t.sales, t.expense, t.profit, t.carryStart, t.net, t.billCount, '']);
  const ws1 = sheet([[shop + ' — รายรับ-รายจ่ายรายวัน ' + thMonth(m.month)], []].concat([head], rows, [foot]),
    [12, 14, 14, 12, 16].concat(incCols.map(() => 14), [15, 16, 14, 14, 14, 10, 14]), [{ s: { r: 0, c: 0 }, e: { r: 0, c: head.length - 1 } }]);

  // 2) สรุปยอดรายเดือน
  const unsplit = Math.round((t.sales - (t.food + t.drink - t.discount + t.concert + t.extrasTotal)) * 100) / 100;
  const stmt = [[shop + ' — สรุปยอดรายเดือน ' + thMonth(m.month)], [], ['รายรับ', ''],
    ['- ยอดขายอาหาร', t.food], ['- ยอดขายเครื่องดื่ม', t.drink], ['- ค่าบัตรคอนเสิร์ต', t.concert]].concat(incCols.map(x => ['- ' + x.name, t.extras[x.id] || 0]), [['- ส่วนลด', -t.discount]])
    .concat(unsplit ? [['- ยอดจากบิลที่ยังไม่สรุปรายวัน', unsplit]] : [])
    .concat([['รวมรายรับ', t.sales], [], ['รายจ่าย', '']])
    .concat(m.byGroup.map(g => ['- ' + g.group, g.amount]))
    .concat([['รวมรายจ่าย', t.expense], [], ['คงเหลือ (กำไร/ขาดทุน)', t.profit], ['ยอดยกมาต้นเดือน', t.carryStart], ['ยอดสุทธิ', t.net], [],
      ['กำไรอาหาร', m.food.profit], ['% กำไรอาหาร', m.food.pct / 100], ['กำไรเครื่องดื่ม', m.drink.profit], ['% กำไรเครื่องดื่ม', m.drink.pct / 100], [],
      ['รับเงินสด', t.cashIn], ['รับเงินโอน', t.transferIn]]);
  const ws2 = sheet(stmt, [34, 16], [{ s: { r: 0, c: 0 }, e: { r: 0, c: 1 } }]);
  Object.keys(ws2).forEach(k => { if (k[0] !== '!' && ws2[k].t === 'n' && /^% /.test((ws2['A' + k.slice(1)] || {}).v || '')) ws2[k].z = '0.00%'; });

  // 3) รายจ่ายแต่ละหมวด
  const ws3 = sheet([['หมวดรายจ่าย', 'กลุ่มในรายงาน', 'จำนวนเงิน']]
    .concat(m.byCategory.map(c => [c.name, c.group, c.amount]))
    .concat([['รวมรายจ่าย', '', t.expense]]), [24, 26, 16]);

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws1, 'รายวัน');
  XLSX.utils.book_append_sheet(wb, ws2, 'สรุปเดือน');
  XLSX.utils.book_append_sheet(wb, ws3, 'รายจ่ายตามหมวด');
  XLSX.writeFile(wb, 'บัญชี-' + m.month + '.xlsx');
}

function pbox(title, b) {
  return '<div class="pbox"><div class="t">' + title + '</div><div class="v">' + signed(b.profit) + '</div>' +

    '<div class="muted small">ขาย ' + fmt(b.sales) + ' · ทุน ' + fmt(b.cost) + '</div></div>';
}

function drawMonthCharts(m) {
  destroyCharts();
  if (typeof Chart === 'undefined') return;
  Chart.defaults.font.family = "'Prompt', sans-serif";
  Chart.defaults.color = '#7b8781';
  const tick = v => Math.abs(v) >= 1000 ? (v / 1000) + 'k' : v;
  S.charts.push(new Chart($('#chart-daily'), {
    data: {
      labels: m.daily.map(r => Number(r.date.slice(8))),
      datasets: [
        { type: 'bar', label: 'ยอดขาย', data: m.daily.map(r => r.sales), backgroundColor: '#8db8a4', borderRadius: 4, order: 2 },
        { type: 'bar', label: 'รายจ่าย', data: m.daily.map(r => r.expense), backgroundColor: '#efc1a3', borderRadius: 4, order: 2 },
        { type: 'line', label: 'กำไรรายวัน', data: m.daily.map(r => (r.sales || r.expense) ? r.profit : null), borderColor: '#4b7965', backgroundColor: '#4b7965', pointRadius: 2, tension: .3, spanGaps: true, order: 1 },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, usePointStyle: true } },
        tooltip: { callbacks: { title: it => 'วันที่ ' + it[0].label, label: c => c.dataset.label + ': ' + fmt(c.parsed.y) } } },
      scales: { x: { grid: { display: false } }, y: { ticks: { callback: tick }, grid: { color: '#eef1ed' } } },
    },
  }));
  const groups = m.byGroup.filter(g => g.amount > 0);
  if (groups.length) {
    S.charts.push(new Chart($('#chart-group'), {
      type: 'doughnut',
      data: { labels: groups.map(g => g.group), datasets: [{ data: groups.map(g => g.amount), backgroundColor: groups.map(g => g.color), borderWidth: 2, borderColor: '#fff' }] },
      options: { responsive: true, maintainAspectRatio: false, cutout: '62%',
        plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: { size: 11 } } },
          tooltip: { callbacks: { label: c => c.label + ': ' + fmt(c.parsed) } } } },
    }));
  }
}

      const msg = x.usedCount

      close(); adminIncome(r.list);
    },
  });
  buttons.push({ spacer: true }, { text: 'ยกเลิก' }, { text: 'บันทึก', cls: 'btn-primary', primary: true, onClick: async (f, close) => {
    const d = formData(f);
    const r = await call('saveIncomeType', { incomeType: { id: x.id, name: d.name, color: d.color, sort: d.sort, active: d.active } });
    toast('บันทึกหัวข้อรายรับแล้ว', 'success'); close(); adminIncome(r);

    title: edit ? 'แก้ไขหัวข้อรายรับ' : 'เพิ่มหัวข้อรายรับ',
    body: field('ชื่อหัวข้อรายรับ', input('name', x.name, 'placeholder="เช่น ค่าห้อง VIP, ค่าอื่น ๆ" autocomplete="off"')) +

    buttons: buttons,
  });
}

/* ----- Payroll: รอบจ่ายค่าแรง + เบิกล่วงหน้า ----- */
const RUN_STATUS = { draft: ['ร่าง', 'pending'], paid: ['จ่ายแล้ว', 'staff'] };

const GROUP_LABEL = { daily: 'รายวัน', monthly: 'รายเดือน' };
const runGroup = run => run.group === 'monthly' ? 'monthly' : 'daily';

function defaultPeriod(g) {
  const t = S.today, m = t.slice(0, 7), last = addDays(addMonths(m, 1) + '-01', -1);
  if (g === 'monthly') return [m + '-01', last];
  return Number(t.slice(8)) <= 15 ? [m + '-01', m + '-15'] : [m + '-16', last];
}

function draftParams(h) {
  const g = S.payGroup || 'daily';
  const p = defaultPeriod(g);
  return Object.assign({ group: g, payDate: S.today, periodStart: p[0], periodEnd: p[1], note: '' }, h || {}, { group: g });
}

/**
 * หน้าเงินเดือนพนักงาน:
 * - ไม่ได้เปิดรอบเดิม → ตารางรอบจ่ายใหม่ (เลือก รายวัน/รายเดือน) + ประวัติรอบจ่าย + เบิกล่วงหน้า
 * - เปิดรอบเดิม → ตารางของรอบนั้น
 */
async function adminPayroll() {
  if (S.payRunId) {
    $('#admin-body').innerHTML = '<div id="run-editor"><div class="page-loading">กำลังโหลด...</div></div>';
    return payRunEditor();
  }
  S.payGroup = S.payGroup || 'daily';
  $('#admin-body').innerHTML =
    '<div id="run-editor"><div class="page-loading">กำลังโหลด...</div></div>' +
    '<div id="run-list" style="margin-top:16px"></div>' +
    '<div id="adv-body" style="margin-top:16px"></div>';
  await payRunEditor();
  renderRunList(await call('listPayRuns'));
  await adminAdvances();
}

function renderRunList(runs) {
  const box = $('#run-list');
  if (!box) return;
  box.innerHTML = adminCard('ประวัติรอบจ่าย', '<span class="muted small">' + runs.length + ' รอบ · แตะเพื่อเปิด/แก้ไข</span>',
    '<div class="table-wrap"><table class="tbl"><thead><tr><th>วันที่จ่าย</th><th>ประเภท</th><th class="hide-sm">งวด</th><th class="right">จำนวนคน</th><th class="right hide-sm">รวมเงิน</th><th class="right hide-sm">รายการหัก</th><th class="right">ได้รับสุทธิ</th><th>สถานะ</th></tr></thead><tbody>' +
    (runs.map(r => {
      const st = RUN_STATUS[r.status === 'paid' ? 'paid' : 'draft'];
      return '<tr class="click" data-run="' + r.id + '"><td><b>' + thDate(r.payDate) + '</b>' + (r.note ? '<div class="muted small">' + esc(r.note) + '</div>' : '') + '</td>' +
        '<td><span class="badge ' + (runGroup(r) === 'monthly' ? 'admin' : 'transfer') + '">' + GROUP_LABEL[runGroup(r)] + '</span></td>' +
        '<td class="small hide-sm">' + (r.periodStart || r.periodEnd ? thDate(r.periodStart) + ' – ' + thDate(r.periodEnd) : '<span class="muted">—</span>') + '</td>' +
        '<td class="num">' + r.totals.count + '</td><td class="num hide-sm">' + fmt(r.totals.base + r.totals.addition) + '</td><td class="num hide-sm">' + fmt(r.totals.deduction + (r.totals.otherDeduction || 0)) + '</td>' +
        '<td class="num"><b>' + fmt(r.totals.net) + '</b></td><td><span class="badge ' + st[1] + '">' + st[0] + '</span></td></tr>';
    }).join('') || emptyRow(8, 'ยังไม่มีรอบจ่ายที่บันทึกไว้')) +
    '</tbody></table></div>' +
    '<div class="card-body muted small" style="border-top:1px solid var(--border)">รอบที่ “จ่ายแล้ว” นับยอดสุทธิเป็นรายจ่าย “ค่าแรงพนักงาน” ในวันที่จ่าย · ยอดเบิกล่วงหน้านับเป็นรายจ่ายในวันที่เบิก แล้วนำมาหักในรอบจ่าย</div>');
  $$('[data-run]', box).forEach(r => { r.onclick = async () => {
    if (S.runDirty && !(await confirmBox('ตารางที่กรอกไว้ยังไม่ได้บันทึก เปิดรอบอื่นโดยไม่บันทึก?', 'เปิดโดยไม่บันทึก', true))) return;
    S.payRunId = r.dataset.run; S.payRunData = null; adminPayroll(); window.scrollTo(0, 0);
  }; });
}

async function switchGroup(g) {
  if (g === S.payGroup) return;
  if (S.runDirty && !(await confirmBox('ตารางที่กรอกไว้ยังไม่ได้บันทึก เปลี่ยนเป็น' + GROUP_LABEL[g] + 'โดยไม่บันทึก?', 'เปลี่ยน', true))) return;
  S.payGroup = g; S.payRunData = null; S.runDirty = false;
  $('#run-editor').innerHTML = '<div class="page-loading">กำลังโหลด...</div>';
  await payRunEditor();
}


/* ----- ตัวแก้ไขรอบจ่าย (ตารางแบบใบสรุปค่าแรง) ----- */
const RUN_FIELDS = ['employeeName', 'position', 'rate', 'days', 'addition', 'deduction', 'otherDeduction', 'bank', 'accountNo', 'payment', 'note'];
const isMonthlyRun = () => S.run && runGroup(S.run.run) === 'monthly';

function runTableHead(monthly) {

      '<tr><th>ชื่อพนักงาน</th><th>ตำแหน่ง</th><th class="right">เบิกล่วงหน้า</th><th class="right">รายจ่ายอื่น</th><th>ธนาคาร</th><th>เลขบัญชี</th></tr>';

    '<tr><th>ชื่อพนักงาน</th><th>ตำแหน่ง</th><th class="right">ค่าแรง</th><th class="right">จำนวนวัน</th><th class="right">รวมเงิน</th><th>ธนาคาร</th><th>เลขบัญชี</th></tr>';
}

      '<div class="toolbar-actions">' +
        '<button class="btn btn-primary" id="run-save">' + (isNew ? 'บันทึกรอบจ่าย' : 'บันทึก') + '</button>' +

    (paid ? '<div class="notice no-print">' + I.lock + '<span>รอบนี้จ่ายแล้ว (' + esc(run.paidAt) + ') — ยอดสุทธินับเป็นรายจ่ายวันที่ ' + thDate(run.payDate) + ' แก้ไขได้ ระบบเก็บประวัติการแก้ไขไว้</span></div>' : '') +
    '<div class="card"><div class="card-body payrun-head">' +
      '<div class="print-only print-title"><b>' + esc(S.settings.shopName) + '</b><br>' + docTitle + ' ประจำวันที่ <span id="pt-date"></span><br><span class="small" id="pt-period"></span></div>' +
      '<div class="row-4 no-print">' +

        '<button class="btn btn-sm btn-ghost" id="run-add-blank">' + I.plus + ' เพิ่มแถวว่าง</button>' +
        '<button class="btn btn-sm btn-ghost" id="run-adv" title="บันทึกงวดแล้วนำยอดเบิกล่วงหน้าในงวดมาใส่ช่องหัก">↻ ดึงยอดเบิกในงวด</button>' +
        '<span class="muted small" style="margin-left:auto">' + (monthly ? 'ได้รับสุทธิ = เงินเดือน + รายการเพิ่ม − เบิกล่วงหน้า − รายจ่ายอื่น' : 'กรอกค่าแรง × จำนวนวัน ระบบคำนวณรวมเงินและยอดสุทธิให้') + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="stats" style="margin-top:16px" id="run-stats"></div>' + bankList();

  const tbody = $('#run-table tbody');
  data.items.forEach(i => tbody.appendChild(runRow(i)));
  renumber(); recalcRun(); fillAddEmp();
  if (!host.dataset.bound) {
    host.dataset.bound = '1';
    host.addEventListener('input', e => { if (e.target.closest('#run-table, .payrun-head')) markDirty(); });
    host.addEventListener('change', e => { if (e.target.closest('#run-table, .payrun-head')) markDirty(); });
  }
  $$('[data-group]', host).forEach(b => { b.onclick = () => switchGroup(b.dataset.group); });
  // รอบใหม่: เปลี่ยนงวด → ดึงยอดเบิกของงวดใหม่ให้ทันที
  if (isNew) ['#run-periodStart', '#run-periodEnd'].forEach(sel => { $(sel).addEventListener('change', () => pullAdvances(true)); });

  if ($('#run-back')) $('#run-back').onclick = async () => {
    if (S.runDirty && !(await confirmBox('มีการแก้ไขที่ยังไม่ได้บันทึก ออกโดยไม่บันทึก?', 'ออกโดยไม่บันทึก', true))) return;
    S.payRunId = null; S.payRunData = null; S.runDirty = false; adminPayroll();
  };
  $('#run-save').onclick = () => saveRun().catch(e => toast(e.message, 'error'));
  if ($('#run-paid')) $('#run-paid').onclick = async () => {
    try {
      if (S.runDirty) await saveRun(true);
      const t = collectRun().totals;
      if (!(await confirmBox('ยืนยันจ่าย' + (monthly ? 'เงินเดือน ' : 'ค่าแรง ') + t.count + ' คน ยอดสุทธิ ' + fmt(t.net) + ' บาท (โอน ' + fmt(t.transfer) + ' · เงินสด ' + fmt(t.cash) + ') ในวันที่ ' + thDate($('#run-payDate').value) + '?', 'ยืนยันจ่ายแล้ว'))) return;
      S.payRunData = await call('setPayRunStatus', { id: run.id, status: 'paid' });
      toast('บันทึกการจ่ายแล้ว — นับเป็นรายจ่ายค่าแรงพนักงาน', 'success'); payRunEditor();
    } catch (e) { toast(e.message, 'error'); }
  };
  if ($('#run-unpaid')) $('#run-unpaid').onclick = async () => {
    if (!(await confirmBox('ยกเลิกสถานะจ่ายแล้ว? ยอดของรอบนี้จะไม่ถูกนับเป็นรายจ่ายจนกว่าจะยืนยันใหม่', 'ยกเลิกสถานะ', true))) return;
    try { S.payRunData = await call('setPayRunStatus', { id: run.id, status: 'draft' }); toast('เปลี่ยนเป็นร่างแล้ว'); payRunEditor(); }
    catch (e) { toast(e.message, 'error'); }
  };
  if ($('#run-del')) $('#run-del').onclick = async () => {
    if (!(await confirmBox('ลบรอบจ่ายวันที่ ' + thDate(run.payDate) + ' ทั้งรอบ?', 'ลบ', true))) return;
    try { await call('deletePayRun', { id: run.id }); toast('ลบรอบจ่ายแล้ว'); S.payRunId = null; S.payRunData = null; S.runDirty = false; adminPayroll(); }
    catch (e) { toast(e.message, 'error'); }
  };
  $('#run-excel').onclick = () => { try { exportRunExcel(); toast('ส่งออกไฟล์ Excel แล้ว', 'success'); } catch (e) { toast(e.message, 'error'); } };

  $('#run-add').onclick = () => {
    const id = $('#run-add-emp').value;
    const e = S.run.employees.find(x => x.id === id);
    if (!e) return toast('เลือกพนักงานก่อน', 'error');
    const adv = S.run.advances[e.id];
    tbody.appendChild(runRow({
      employeeId: e.id, employeeName: e.name + (e.nickname ? ' (' + e.nickname + ')' : ''), position: e.position, rate: e.rate,
      days: monthly ? 1 : 0, deduction: adv ? adv.amount : 0, note: adv ? 'หักเบิก ' + adv.count + ' ครั้ง' : '',
      bank: e.bank, accountNo: e.accountNo, payment: e.accountNo ? 'โอน' : 'เงินสด',
    }));

  };
  $('#run-adv').onclick = () => pullAdvances(false);
  $('#run-add-blank').onclick = () => { tbody.appendChild(runRow({ payment: 'เงินสด', days: monthly ? 1 : 0 })); renumber(); recalcRun(); markDirty(); $('tr:last-child [data-f=employeeName]', tbody).focus(); };
}

function runRow(i) {
  const monthly = isMonthlyRun();
  const tr = document.createElement('tr');
  tr.dataset.id = i.id || '';
  tr.dataset.emp = i.employeeId || '';
  const cell = (f, v, cls, attrs) => '<td><input class="cell ' + (cls || '') + '" data-f="' + f + '" value="' + esc(v == null ? '' : v) + '" ' + (attrs || '') + ' autocomplete="off"></td>';
  const numCell = (f, v) => cell(f, v || '', 'num-in', 'inputmode="decimal" placeholder="0"');
  tr.innerHTML = '<td class="idx"></td>' +
    cell('employeeName', i.employeeName, 'w-name', 'placeholder="ชื่อพนักงาน"') +
    cell('position', i.position, 'w-pos') +
    (monthly
      ? numCell('rate', i.rate) + numCell('addition', i.addition) + numCell('deduction', i.deduction) + numCell('otherDeduction', i.otherDeduction)
      : numCell('rate', i.rate) + numCell('days', i.days) + '<td class="num calc" data-c="base"></td>' + numCell('addition', i.addition) + numCell('deduction', i.deduction)) +
    '<td class="num calc net" data-c="net"></td>' +
    cell('bank', i.bank, 'w-bank', 'list="bank-list"') + cell('accountNo', i.accountNo, 'w-acct', 'inputmode="numeric"') +
    '<td><select class="cell" data-f="payment">' + S.payments.map(p => '<option' + (p === (i.payment || 'โอน') ? ' selected' : '') + '>' + esc(p) + '</option>').join('') + '</select></td>' +
    cell('note', i.note, 'w-note') +
    '<td class="no-print"><button class="icon-btn" data-del title="ลบแถว" style="width:30px;height:30px">' + I.x + '</button></td>';
  $('[data-del]', tr).onclick = () => { tr.remove(); renumber(); recalcRun(); fillAddEmp(); markDirty(); };
  tr.addEventListener('input', recalcRun);
  return tr;
}

function renumber() { $$('#run-table tbody tr').forEach((tr, i) => { $('.idx', tr).textContent = i + 1; }); }

function collectRun() {
  const monthly = isMonthlyRun();
  const items = $$('#run-table tbody tr').map(tr => {
    const o = { id: tr.dataset.id || undefined, employeeId: tr.dataset.emp || '' };
    RUN_FIELDS.forEach(f => { const el = $('[data-f=' + f + ']', tr); o[f] = el ? el.value.trim() : ''; });
    ['rate', 'days', 'addition', 'deduction', 'otherDeduction'].forEach(f => { o[f] = num(o[f]); });
    if (monthly) o.days = 1;
    o.base = Math.round(o.rate * o.days * 100) / 100;
    o.net = Math.round((o.base + o.addition - o.deduction - o.otherDeduction) * 100) / 100;
    return o;
  });
  const t = { count: items.length, base: 0, addition: 0, deduction: 0, otherDeduction: 0, net: 0, cash: 0, transfer: 0 };
  items.forEach(i => {
    t.base += i.base; t.addition += i.addition; t.deduction += i.deduction; t.otherDeduction += i.otherDeduction; t.net += i.net;
    if (i.payment === 'เงินสด') t.cash += i.net; else t.transfer += i.net;
  });
  return { items: items, totals: t };
}

function recalcRun() {
  const monthly = isMonthlyRun();
  const rows = $$('#run-table tbody tr');
  const c = collectRun();
  rows.forEach((tr, k) => {
    const i = c.items[k];
    const b = $('[data-c=base]', tr); if (b) b.textContent = fmt(i.base);
    $('[data-c=net]', tr).innerHTML = i.net < 0 ? '<span class="neg">' + fmt(i.net) + '</span>' : '<b>' + fmt(i.net) + '</b>';
  });
  const t = c.totals;
  $('#run-table tfoot').innerHTML = monthly
    ? '<tr><td></td><td colspan="2">รวม ' + t.count + ' คน</td><td class="num">' + fmt(t.base) + '</td><td class="num">' + fmt(t.addition) + '</td><td class="num">' + fmt(t.deduction) + '</td><td class="num">' + fmt(t.otherDeduction) + '</td><td class="num">' + fmt(t.net) + '</td><td colspan="5"></td></tr>'
    : '<tr><td></td><td colspan="4">รวม ' + t.count + ' คน</td><td class="num">' + fmt(t.base) + '</td><td class="num">' + fmt(t.addition) + '</td><td class="num">' + fmt(t.deduction) + '</td><td class="num">' + fmt(t.net) + '</td><td colspan="5"></td></tr>';
  $('#run-stats').innerHTML =
    stat('ได้รับสุทธิรวม', fmt(t.net), t.count + ' คน', 'var(--primary)') +
    (monthly
      ? stat('เงินเดือน + รายการเพิ่ม', fmt(t.base + t.addition), 'หักเบิก ' + fmt(t.deduction) + ' · หักอื่น ' + fmt(t.otherDeduction), 'var(--accent)')
      : stat('รวมเงิน + รายการเพิ่ม', fmt(t.base + t.addition), 'รายการหัก (เบิก) ' + fmt(t.deduction), 'var(--accent)')) +
    stat('จ่ายโดยโอน', fmt(t.transfer), '', 'var(--info)') +
    stat('จ่ายเงินสด', fmt(t.cash), '', 'var(--success)');
  const pd = $('#run-payDate'); if (pd) $('#pt-date').textContent = thDate(pd.value);
  const ps = $('#run-periodStart').value, pe = $('#run-periodEnd').value;
  $('#pt-period').textContent = ps || pe ? 'งวด ' + thDate(ps) + ' – ' + thDate(pe) : '';
}

function fillAddEmp() {
  const g = runGroup(S.run.run);
  const inRun = new Set($$('#run-table tbody tr').map(tr => tr.dataset.emp).filter(Boolean));
  const avail = S.run.employees.filter(e => e.active && !inRun.has(e.id) && (e.payType === 'monthly' ? 'monthly' : 'daily') === g);
  $('#run-add-emp').innerHTML = '<option value="">— เพิ่มพนักงาน' + GROUP_LABEL[g] + ' (' + avail.length + ') —</option>' +
    avail.map(e => '<option value="' + e.id + '">' + esc(e.name + (e.position ? ' (' + e.position + ')' : '')) + '</option>').join('');
}

function markDirty() { S.runDirty = true; const d = $('#run-dirty'); if (d) d.textContent = '● ยังไม่ได้บันทึก'; }

const runHeaderVals = () => ({ payDate: $('#run-payDate').value, periodStart: $('#run-periodStart').value, periodEnd: $('#run-periodEnd').value, note: $('#run-note').value });

async function saveRun(silent) {
  const c = collectRun();
  if (!c.items.length) throw new Error('ยังไม่มีรายการพนักงานในตาราง');
  const bad = c.items.find(i => i.net < 0);
  if (bad) throw new Error((bad.employeeName || 'แถวที่ไม่มีชื่อ') + ': ยอดหักมากกว่ารายได้');
  if (!S.run.run.id) {
    // ตารางใหม่ → สร้างรอบจ่าย แล้วเปิดรอบนั้น (ยืนยันจ่ายแล้ว / พิมพ์ / Excel ต่อได้)
    const r = await call('createPayRun', Object.assign({ group: runGroup(S.run.run) }, runHeaderVals(), { items: c.items }));
    toast('บันทึกรอบจ่าย' + GROUP_LABEL[runGroup(r.run)] + 'แล้ว', 'success');
    S.runDirty = false; S.payRunId = r.run.id; S.payRunData = r;
    await adminPayroll();
    return;
  }
  const r = await call('savePayRun', { run: Object.assign({ id: S.run.run.id }, runHeaderVals()), items: c.items });
  if (!silent) toast('บันทึกรอบจ่ายแล้ว', 'success');
  S.payRunData = r;
  await payRunEditor();
}

/** ดึงยอดเบิกล่วงหน้าในงวดปัจจุบันมาใส่ช่องหัก (ไม่บันทึกจนกว่าจะกดบันทึก) */
async function pullAdvances(quiet) {
  try {
    const d = await call('draftPayRun', Object.assign({ group: runGroup(S.run.run) }, runHeaderVals()));
    S.run.advances = d.advances;
    let n = 0;
    $$('#run-table tbody tr').forEach(tr => {
      if (!tr.dataset.emp) return;
      const a = d.advances[tr.dataset.emp];
      const ded = $('[data-f=deduction]', tr), note = $('[data-f=note]', tr);
      const v = a ? a.amount : 0;
      if (num(ded.value) !== v) { ded.value = v || ''; n++; }
      if (a) note.value = 'หักเบิก ' + a.count + ' ครั้ง';
      else if (/^หักเบิก \d+ ครั้ง$/.test(note.value)) note.value = '';
    });
    recalcRun();
    if (n) { markDirty(); toast('อัปเดตยอดเบิกในงวดแล้ว ' + n + ' แถว'); }
    else if (!quiet) toast('ยอดเบิกในงวดตรงกับรายการหักอยู่แล้ว');
  } catch (e) { toast(e.message, 'error'); }
}

function exportRunExcel() {
  if (typeof XLSX === 'undefined') throw new Error('โหลดตัวสร้างไฟล์ Excel ไม่สำเร็จ กรุณารีเฟรชหน้า');
  const monthly = isMonthlyRun();
  const c = collectRun();
  const t = c.totals;
  const payDate = $('#run-payDate').value, ps = $('#run-periodStart').value, pe = $('#run-periodEnd').value;
  const title = (monthly ? 'สรุปเงินเดือนพนักงาน (รายเดือน)' : 'สรุปค่าแรงพนักงาน (รายวัน)') + ' ประจำวันที่ ' + thDate(payDate) + (ps || pe ? '  (งวด ' + thDate(ps) + ' – ' + thDate(pe) + ')' : '');
  let head, rows, total, textCols, cols;
  if (monthly) {
    head = ['ลำดับ', 'ชื่อพนักงาน', 'ตำแหน่ง', 'เงินเดือน', 'รายการเพิ่ม', 'หักเบิกล่วงหน้า', 'หักรายจ่ายอื่น', 'ได้รับสุทธิ', 'ธนาคาร', 'เลขบัญชี', 'จ่ายโดย', 'หมายเหตุ'];
    rows = c.items.map((i, k) => [k + 1, i.employeeName, i.position, i.base, i.addition, i.deduction, i.otherDeduction, i.net, i.bank, i.accountNo, i.payment, i.note]);
    total = ['รวม', t.count + ' คน', '', t.base, t.addition, t.deduction, t.otherDeduction, t.net, '', '', '', ''];
    textCols = ['J']; cols = [6, 24, 12, 14, 12, 14, 14, 14, 16, 16, 10, 20];
  } else {
    head = ['ลำดับ', 'ชื่อพนักงาน', 'ตำแหน่ง', 'ค่าแรง', 'จำนวนวัน', 'รวมเงิน', 'รายการเพิ่ม', 'รายการหัก (เบิก)', 'ได้รับสุทธิ', 'ธนาคาร', 'เลขบัญชี', 'จ่ายโดย', 'หมายเหตุ'];
    rows = c.items.map((i, k) => [k + 1, i.employeeName, i.position, i.rate, i.days, i.base, i.addition, i.deduction, i.net, i.bank, i.accountNo, i.payment, i.note]);
    total = ['รวม', t.count + ' คน', '', '', '', t.base, t.addition, t.deduction, t.net, '', '', '', ''];
    textCols = ['K']; cols = [6, 24, 12, 10, 10, 12, 12, 14, 14, 16, 16, 10, 20];
  }
  const netCol = head.indexOf('ได้รับสุทธิ');
  const pad = v => { const r = new Array(head.length).fill(''); r[0] = v[0]; r[netCol] = v[1]; return r; };
  const aoa = [[S.settings.shopName], [title], []].concat([head], rows, [total], [[], pad(['จ่ายโดยโอน', t.transfer]), pad(['จ่ายเงินสด', t.cash])]);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  Object.keys(ws).forEach(k => {
    if (k[0] === '!') return;
    const col = k.replace(/\d+/g, '');
    if (ws[k].t === 'n' && col !== 'A' && !(col === 'E' && !monthly)) ws[k].z = '#,##0.00';
    if (textCols.indexOf(col) >= 0 && ws[k].v !== undefined) { ws[k].t = 's'; ws[k].v = String(ws[k].v); }
  });
  ws['!cols'] = cols.map(w => ({ wch: w }));
  ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: head.length - 1 } }, { s: { r: 1, c: 0 }, e: { r: 1, c: head.length - 1 } }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, monthly ? 'เงินเดือน' : 'ค่าแรงรายวัน');
  XLSX.writeFile(wb, (monthly ? 'เงินเดือน-' : 'ค่าแรงรายวัน-') + payDate + '.xlsx');
}

    '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">' +
      '<button class="icon-btn" data-act="pprev" style="width:32px;height:32px">' + I.left + '</button>' +

      '<button class="icon-btn" data-act="pnext" style="width:32px;height:32px">' + I.right + '</button>' +
      '<button class="btn btn-accent btn-sm" id="add-pay">' + I.plus + ' บันทึกเบิก/จ่าย</button></div>',

      '</tbody>' + (data.entries.length ? '<tfoot><tr><td colspan="3">รวม ' + thMonth(data.month) + '</td><td class="num">' + fmt(data.total) + '</td><td></td></tr></tfoot>' : '') + '</table></div>');
  $('[data-act="pprev"]', box).onclick = () => { S.payMonth = addMonths(S.payMonth, -1); adminAdvances(); };
  $('[data-act="pnext"]', box).onclick = () => { S.payMonth = addMonths(S.payMonth, 1); adminAdvances(); };
  $('#pay-month').onchange = e => { if (e.target.value) { S.payMonth = e.target.value; adminAdvances(); } };
  $('#add-pay').onclick = () => payrollModal(null, data);
  $$('[data-id]', box).forEach(r => { r.onclick = () => payrollModal(data.entries.find(x => x.id === r.dataset.id), data); });
}

function payrollModal(x, data) {
  const edit = !!x;
  const emps = data.employees.filter(e => e.active || (x && e.id === x.employeeId));
  if (!emps.length) {
    toast('กรุณาเพิ่มรายชื่อพนักงานก่อน', 'error');
    S.adminTab = 'employees'; render(); return;
  }
  const defDate = S.payMonth === S.today.slice(0, 7) ? S.today : S.payMonth + '-01';
  x = x || { date: defDate, type: 'เบิกล่วงหน้า', payment: S.payments[0], employeeId: '' };
  const buttons = [];
  if (edit) buttons.push({ text: 'ลบ', cls: 'btn-danger', onClick: async (f, close) => {
    if (!(await confirmBox('ลบรายการ ' + x.employeeName + ' ' + fmt(x.amount) + ' บาท?', 'ลบ', true))) return;
    const r = await call('deletePayroll', { id: x.id, month: S.payMonth });
    toast('ลบรายการแล้ว'); close(); adminAdvances(r);
  } });
  buttons.push({ spacer: true }, { text: 'ยกเลิก' }, { text: 'บันทึก', cls: 'btn-primary', primary: true, onClick: async (f, close) => {
    const d = formData(f);
    if (!d.employeeId) throw new Error('กรุณาเลือกพนักงาน');
    const r = await call('savePayroll', { entry: { id: x.id, date: d.date, employeeId: d.employeeId, type: d.type, amount: num(d.amount), payment: d.payment, note: d.note } });
    S.payMonth = r.month;
    toast('บันทึกแล้ว', 'success'); close(); adminAdvances(r);
  } });
  openModal({
    title: edit ? 'แก้ไขรายการเบิก/จ่าย' : 'บันทึกเบิก/จ่ายรายครั้ง',
    body: field('พนักงาน', select('employeeId', [{ value: '', label: '— เลือกพนักงาน —' }].concat(emps.map(e => ({ value: e.id, label: e.name + (e.position ? ' (' + e.position + ')' : '') }))), x.employeeId)) +
      '<div class="row">' + field('วันที่', '<input type="date" class="input" name="date" value="' + esc(x.date) + '">') + field('ประเภท', select('type', S.payrollTypes.map(t => ({ value: t, label: t })), x.type)) + '</div>' +
      field('จำนวนเงิน', money('amount', x.amount)) +
      field('ช่องทางจ่าย', seg('payment', S.payments, x.payment)) +
      field('หมายเหตุ', input('note', x.note, 'autocomplete="off"')) +
      '<p class="muted small" style="margin:0 0 10px">“เบิกล่วงหน้า” จะถูกนำไปหักในรอบจ่ายค่าแรงที่งวดครอบคลุมวันที่เบิกโดยอัตโนมัติ (ตอนสร้างรอบจ่าย)</p>',
    buttons: buttons,
  });
}

function userModal(u) {
  const edit = !!u;
  const self = edit && u.id === S.user.id;
  u = u || { role: 'staff', active: true };
  const buttons = [];
  if (edit && !self) buttons.push({ text: 'ลบ', cls: 'btn-danger', onClick: async (f, close) => {
    if (!(await confirmBox('ลบผู้ใช้ @' + u.username + '?', 'ลบ', true))) return;
    const r = await call('deleteUser', { id: u.id }); toast('ลบผู้ใช้แล้ว'); close(); adminUsers(r);
  } });
  buttons.push({ spacer: true }, { text: 'ยกเลิก' }, { text: 'บันทึก', cls: 'btn-primary', primary: true, onClick: async (f, close) => {
    const d = formData(f);
    const r = await call('saveUser', { user: { id: u.id, username: d.username, displayName: d.displayName, role: self ? 'admin' : d.role, active: self ? true : d.active, password: d.password } });
    toast('บันทึกผู้ใช้แล้ว', 'success'); close(); adminUsers(r);
    if (self) { S.user.displayName = d.displayName || S.user.displayName; showApp(); }
  } });
  openModal({
    title: edit ? 'แก้ไขผู้ใช้' : 'เพิ่มผู้ใช้',
    body: field('ชื่อที่แสดง', input('displayName', u.displayName, 'autocomplete="off"')) +
      field('ชื่อผู้ใช้ (a-z, 0-9)', input('username', u.username, 'autocapitalize="none" autocomplete="off"')) +
      field(edit ? 'รหัสผ่านใหม่ (ว่างไว้ = ไม่เปลี่ยน)' : 'รหัสผ่าน (อย่างน้อย 6 ตัว)', '<input class="input" type="password" name="password" autocomplete="new-password">') +
      (self ? '<p class="muted small">ไม่สามารถเปลี่ยนสิทธิ์หรือปิดบัญชีของตัวเองได้</p>' :
        field('สิทธิ์', seg('role', [{ value: 'staff', label: 'พนักงาน' }, { value: 'admin', label: 'ผู้ดูแลระบบ' }], u.role)) + checkbox('active', 'เปิดใช้งานบัญชี', u.active)),

/* ----- Audit log ----- */
const AUDIT_ACTION = { create: ['เพิ่ม', 'staff'], update: ['แก้ไข', 'admin'], delete: ['ลบ', 'danger'] };
async function adminAudit(data) {
  S.auditMonth = S.auditMonth || S.month;
  S.auditFilter = S.auditFilter || 'changes';
  data = data || await call('listAudit', { month: S.auditMonth });
  S.auditMonth = data.month;
  const catName = {};
  data.categories.forEach(c => { catName[c.id] = c.name; });
  const desc = (entity, json) => {
    if (!json) return '';
    let o; try { o = JSON.parse(json); } catch (e) { return ''; }
    if (entity === 'daysum') return 'อาหาร <b>' + fmt(o.food) + '</b> · เครื่องดื่ม <b>' + fmt(o.drink) + '</b> · ส่วนลด ' + fmt(o.discount) + (o.carryOverride !== '' && o.carryOverride != null ? ' · ยกมา ' + fmt(o.carryOverride) : '') + (o.note ? ' · ' + esc(o.note) : '');
    if (entity === 'cash') return 'เงินทอน <b>' + fmt(o.cashFloat) + '</b> · นับได้ ' + (o.countedCash === '' ? '—' : '<b>' + fmt(o.countedCash) + '</b>') + (o.note ? ' · ' + esc(o.note) : '');
    return entity === 'bill'
      ? 'โต๊ะ ' + esc(o.tableNo || '-') + ' · <b>' + fmt(o.total) + '</b> · ' + esc(o.payment) + (o.discount ? ' · ลด ' + fmt(o.discount) : '') + (o.extras ? ' · ' + (() => { try { return extrasText(JSON.parse(o.extras)); } catch (e) { return ''; } })() : '')
      : esc(catName[o.categoryId] || '') + ' · ' + esc(o.item) + ' · <b>' + fmt(o.amount) + '</b> · ' + esc(o.payment);
  };
  const rows = data.rows.filter(r => S.auditFilter === 'all' || r.action !== 'create' || r.approvedBy || r.entity === 'cash');
  $('#admin-body').innerHTML =
    '<div class="toolbar"><div class="date-nav">' +
      '<button class="icon-btn" data-act="aprev">' + I.left + '</button>' +
      '<input type="month" class="input date-input" id="audit-month" value="' + data.month + '">' +
      '<button class="icon-btn" data-act="anext">' + I.right + '</button>' +
    '</div><div style="min-width:240px" title="แก้ไข, ลบ และเพิ่มย้อนหลังที่ได้รับอนุมัติ">' + seg('auditFilter', [{ value: 'changes', label: 'ที่ต้องตรวจสอบ' }, { value: 'all', label: 'ทั้งหมด' }], S.auditFilter) + '</div></div>' +
    adminCard('ประวัติการแก้ไข ' + thMonth(data.month), '<span class="muted small">' + rows.length + ' รายการ</span>',
      '<div class="table-wrap"><table class="tbl"><thead><tr><th>เวลา</th><th>ผู้ทำ</th><th>การกระทำ</th><th>รายการ (วันที่)</th><th>รายละเอียด</th><th>อนุมัติโดย / เหตุผล</th></tr></thead><tbody>' +
      (rows.map(r => {
        const a = AUDIT_ACTION[r.action] || [r.action, 'off'];
        const detail = r.action === 'update'
          ? '<div class="muted small">เดิม: ' + desc(r.entity, r.before) + '</div><div>ใหม่: ' + desc(r.entity, r.after) + '</div>'
          : desc(r.entity, r.after || r.before);
        return '<tr><td class="small" style="white-space:nowrap">' + thDate(r.at.slice(0, 10)) + '<div class="muted">' + esc(r.at.slice(11, 16)) + '</div></td>' +
          '<td>@' + esc(r.username) + '</td>' +
          '<td><span class="badge ' + a[1] + '">' + a[0] + '</span></td>' +
          '<td style="white-space:nowrap">' + ({ bill: 'บิล', expense: 'รายจ่าย', cash: 'เงินลิ้นชัก', daysum: 'สรุปรายวัน' }[r.entity] || r.entity) + '<div class="muted small">' + thDate(r.recordDate) + '</div></td>' +
          '<td class="small">' + detail + '</td>' +
          '<td class="small">' + (r.approvedBy ? '<span class="badge admin">' + I.lock + ' @' + esc(r.approvedBy) + '</span>' : '<span class="muted">—</span>') + (r.reason ? '<div style="margin-top:2px">' + esc(r.reason) + '</div>' : '') + '</td></tr>';
      }).join('') || emptyRow(6, 'ไม่มีประวัติในเดือนนี้')) +
      '</tbody></table></div>');
  $('[data-act="aprev"]').onclick = () => { S.auditMonth = addMonths(S.auditMonth, -1); adminAudit(); };
  $('[data-act="anext"]').onclick = () => { S.auditMonth = addMonths(S.auditMonth, 1); adminAudit(); };
  $('#audit-month').onchange = e => { if (e.target.value) { S.auditMonth = e.target.value; adminAudit(); } };
  $$('[name=auditFilter]').forEach(x => { x.onchange = () => { S.auditFilter = x.value; adminAudit(data); }; });
}
