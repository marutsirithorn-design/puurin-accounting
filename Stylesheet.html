<style>
:root{
  --bg:#f3f5f1; --surface:#ffffff; --surface-2:#f8faf7; --border:#e2e8e1; --border-2:#d3dcd2;
  --text:#2e3a34; --muted:#7b8781; --faint:#a7b0ab;
  --primary:#5f8f7b; --primary-600:#4b7965; --primary-50:#e8f1ec; --primary-100:#d4e6dc;
  --accent:#d99467; --accent-600:#c47c4e; --accent-50:#fbefe6;
  --danger:#c96464; --danger-50:#fbeaea; --success:#3f8f62; --success-50:#e6f3eb;
  --info:#6a8fb5; --info-50:#e9f0f7; --warning:#c99a3b; --warning-50:#faf2df;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(46,58,52,.05),0 4px 16px rgba(46,58,52,.05);
  --shadow-lg:0 10px 40px rgba(46,58,52,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Prompt',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;font-weight:400;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:13px} .right{text-align:right} .center{text-align:center}
.pos{color:var(--success)} .neg{color:var(--danger)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
h1,h2,h3,h4{margin:0;font-weight:600}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:radial-gradient(1200px 600px at 10% -10%,#dcebe2 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#f6e3d5 0,transparent 55%),var(--bg)}
.login-card{width:100%;max-width:380px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);padding:32px 28px}
.login-logo{width:56px;height:56px;border-radius:16px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.login-card h1{font-size:22px}
.login-card p{margin:4px 0 22px;color:var(--muted)}
.login-error{background:var(--danger-50);color:var(--danger);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;margin-bottom:14px}

/* ---------- Shell ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{width:236px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.brand-logo{width:38px;height:38px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-name{font-weight:600;font-size:16px;line-height:1.2}
.brand-sub{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-btn{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 12px;border-radius:12px;cursor:pointer;color:var(--muted);text-align:left;font-weight:500;transition:.15s}
.nav-btn:hover{background:var(--surface-2);color:var(--text)}
.nav-btn.active{background:var(--primary-50);color:var(--primary-600)}
.nav-btn svg{width:20px;height:20px;flex-shrink:0}
.sidebar-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:14px}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.user-chip:hover{background:var(--surface-2)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-50);color:var(--accent-600);display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.user-chip .name{font-weight:500;font-size:14px;line-height:1.2}
.user-chip .role{font-size:12px;color:var(--muted)}

.logout-btn{width:100%;margin-top:4px;color:var(--danger)}
.logout-btn:hover{background:var(--danger-50);color:var(--danger)}
.logout-icon{color:var(--danger)}
.topbar-mobile-user{gap:8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 28px 6px}
.topbar h2{font-size:22px}
.topbar .sub{color:var(--muted);font-size:13px}
.topbar-mobile-user{display:none}
.page{padding:12px 28px 40px;max-width:1280px;width:100%}
.bottom-nav{display:none}

/* ---------- Components ---------- */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.card-head h3{font-size:16px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.card-head h3 svg{width:20px;height:20px;color:var(--primary);flex-shrink:0}
.card-body{padding:16px 18px}
.card-body.flush{padding:0}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.grid-2.wide-left{grid-template-columns:1.4fr 1fr}
.stack{display:flex;flex-direction:column;gap:16px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--primary))}
.stat .label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .value{font-size:24px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .hint{font-size:12px;color:var(--muted);margin-top:2px}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}
.date-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.date-label{font-weight:500;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:var(--radius-sm);padding:9px 16px;font-weight:500;cursor:pointer;transition:.15s;background:var(--surface);border-color:var(--border-2);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-600)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-accent:hover{background:var(--accent-600)}
.btn-info{background:var(--info);border-color:var(--info);color:#fff}
.btn-info:hover{background:#5a7fa5}
.btn-danger{background:var(--danger-50);border-color:transparent;color:var(--danger)}
.btn-danger:hover{background:#f6dada}
.btn-ghost{background:transparent;border-color:transparent;color:var(--primary-600)}
.btn-ghost:hover{background:var(--primary-50)}
.btn-sm{padding:6px 12px;font-size:14px}
.btn-block{width:100%}
.icon-btn{width:38px;height:38px;border-radius:var(--radius-sm);border:1px solid var(--border-2);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);flex-shrink:0}
.icon-btn:hover{color:var(--text);background:var(--surface-2)}
.icon-btn svg{width:18px;height:18px}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.field .lbl{font-size:13px;color:var(--muted);font-weight:500}
.input,select.input,textarea.input{width:100%;border:1px solid var(--border-2);background:var(--surface);border-radius:var(--radius-sm);padding:10px 12px;outline:none;transition:.15s}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-100)}
.input.money{text-align:right;font-variant-numeric:tabular-nums;font-size:17px}
textarea.input{resize:vertical;min-height:60px}
.date-input{width:auto}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border-2);border-radius:var(--radius-sm);padding:3px;gap:3px}
.seg label{flex:1;margin:0;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:7px 10px;border-radius:8px;color:var(--muted);font-weight:500;font-size:14px}
.seg input:checked+span{background:var(--surface);color:var(--primary-600);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--primary)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches label{cursor:pointer}
.swatches input{position:absolute;opacity:0}
.swatches span{display:block;width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--border-2)}
.swatches input:checked+span{box-shadow:0 0 0 2px var(--text)}

.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:500;color:var(--muted);font-size:13px;text-align:left;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl th.right{text-align:right}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl tr.faded td{color:var(--faint)}
.tbl tr.faded-row td{background:var(--surface-2)}
.tbl tr.today td{background:var(--primary-50)}
.tbl tfoot td{font-weight:600;background:var(--accent-50);border-top:1px solid var(--border)}
.tbl.sheet th{background:#fdf3dc;color:#5c4a22}
.tbl.sheet th.band{background:#e3efd9;color:#3d5a3a;text-align:center;font-weight:600}
.tbl.sheet th.col-exp{background:#ecd5e6}
.tbl.sheet td.col-profit{background:#fbe6e6}
.tbl.sheet th.col-profit{background:#f6d2d2}
.tbl.sheet tr.click:hover td.col-profit{background:#f6d6d6}
.badge.pending{background:var(--warning-50);color:#8a6a1f}
/* ใบสรุปค่าแรง (ตารางแก้ไขได้) */
.group-toggle{display:inline-flex;background:var(--surface);border:1px solid var(--border-2);border-radius:12px;padding:4px;gap:4px}
.group-toggle button{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:9px 16px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.group-toggle button svg{width:18px;height:18px}
.group-toggle button:hover{color:var(--text);background:var(--surface-2)}
.group-toggle button.active{background:var(--primary);color:#fff}
.row-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.row-4 .field{margin-bottom:0}
.tbl.payrun{font-size:13px}
.tbl.payrun th{background:#fdf3dc;color:#5c4a22;padding:8px 8px;border:1px solid #f0e2c2;text-align:left}
.tbl.payrun th.center{text-align:center}
.tbl.payrun td{padding:3px 4px;border:1px solid var(--border)}
.tbl.payrun td.idx{text-align:center;color:var(--muted);width:34px}
.tbl.payrun td.calc{padding:3px 10px;background:var(--surface-2)}
.tbl.payrun td.net{background:var(--primary-50)}
.tbl.payrun tfoot td{padding:9px 10px}
.cell{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 7px;font-size:13px;outline:none}
.cell:hover{border-color:var(--border-2)}
.cell:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 2px var(--primary-100)}
.cell.num-in{text-align:right;font-variant-numeric:tabular-nums;min-width:70px}
.cell.w-name{min-width:150px} .cell.w-pos{min-width:80px} .cell.w-bank{min-width:110px} .cell.w-acct{min-width:120px} .cell.w-note{min-width:110px}
select.cell{min-width:72px;cursor:pointer}
.print-only{display:none}
.print-title{text-align:center;line-height:1.7;margin-bottom:6px}
@media (max-width:900px){ .row-4{grid-template-columns:1fr 1fr} }
@media print{
  .no-print,.tabs,.topbar,.notice,#run-stats{display:none!important}
  .print-only{display:block}
  .cell{border:0!important;padding:2px;box-shadow:none!important}
  select.cell{appearance:none;-webkit-appearance:none}
  .tbl.payrun td,.tbl.payrun th{border:1px solid #999}
  .table-wrap{overflow:visible}
  @page{size:A4 landscape;margin:10mm}
}
.tbl .idx{color:var(--faint);width:36px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty svg{width:36px;height:36px;color:var(--faint);display:block;margin:0 auto 6px}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.badge.cash{background:var(--success-50);color:var(--success)}
.badge.transfer{background:var(--info-50);color:var(--info)}
.badge.admin{background:var(--accent-50);color:var(--accent-600)}
.badge.staff{background:var(--primary-50);color:var(--primary-600)}
.badge.danger{background:var(--danger-50);color:var(--danger)}
.badge svg{width:12px;height:12px}
.notice{display:flex;align-items:flex-start;gap:10px;background:var(--warning-50);color:#7d5f1e;border:1px solid #efdcae;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.notice svg{width:18px;height:18px;flex-shrink:0;margin-top:2px}
.badge.off{background:#eef0ef;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;flex-shrink:0}
.lock{color:var(--faint)}
.lock svg{width:14px;height:14px;vertical-align:-2px}

.kv{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--border);gap:10px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:500;font-variant-numeric:tabular-nums}
.kv.total{border-top:2px solid var(--border);border-bottom:0;margin-top:4px;padding-top:12px}
.kv.total .k{color:var(--text);font-weight:600}
.kv.total .v{font-size:18px;font-weight:600}
.kv.section{border-bottom:0;padding:12px 0 2px;font-weight:600}

.bar-list .item{margin-bottom:12px}
.bar-list .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;gap:8px}
.bar-list .track{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar-list .fill{height:100%;border-radius:99px;background:var(--c)}

.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);padding:4px;border-radius:12px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.seg span{white-space:nowrap}
.tab{border:0;background:none;padding:9px 16px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab.active{background:var(--primary);color:#fff}

.chart-box{position:relative;height:280px}
.chart-box.sm{height:240px}
.profit-box{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pbox{border-radius:12px;padding:14px;background:var(--surface-2);border:1px solid var(--border)}
.pbox .t{font-size:13px;color:var(--muted)}
.pbox .v{font-size:20px;font-weight:600}
.pbox .pct{font-size:13px;font-weight:500}

/* ---------- Modal / toast / loader ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(36,46,41,.42);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fade .15s}
.modal-backdrop.closing{opacity:0;transition:.15s}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:460px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;animation:pop .18s}
.modal.wide{max-width:620px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:17px}
.modal-head .icon-btn{border:0}
.modal-body{padding:18px 20px 4px;overflow-y:auto}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
.modal-foot .spacer{flex:1}
.live-total{display:flex;justify-content:space-between;align-items:center;background:var(--primary-50);color:var(--primary-600);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-weight:500}
.live-total b{font-size:22px;font-variant-numeric:tabular-nums}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}

#toast-root{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--text);color:#fff;padding:10px 18px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:14px;animation:pop .2s;max-width:90vw}
.toast.error{background:var(--danger)}
.toast.success{background:var(--success)}
.loader{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;overflow:hidden;background:var(--primary-100)}
.loader::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:var(--primary);animation:slide 1s infinite ease-in-out}
@keyframes slide{from{left:-40%}to{left:100%}}
.page-loading{padding:60px;text-align:center;color:var(--muted)}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .sidebar{display:none}
  .topbar{padding:14px 16px 4px}
  .topbar h2{font-size:19px}
  .topbar-mobile-user{display:flex}
  .page{padding:8px 16px 96px}
  .grid-2,.grid-2.wide-left{grid-template-columns:1fr}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);z-index:40;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bottom-nav .nav-btn{flex:1;flex-direction:column;gap:2px;font-size:12px;padding:6px 4px;align-items:center;text-align:center}
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .stat{padding:12px}
  .stat .value{font-size:19px}
  .hide-sm{display:none}
  .tbl th,.tbl td{padding:9px 10px}
  .toolbar-actions{width:100%}
  .toolbar-actions .btn{flex:1}
  .modal-backdrop{align-items:flex-end;padding:0}
  .modal{max-width:none;border-radius:18px 18px 0 0;max-height:92vh}
  .modal-foot .btn{flex:1}
  .modal-foot .spacer{display:none}
}
@media (max-width:420px){
  .row-3{grid-template-columns:1fr 1fr}
  .profit-box{grid-template-columns:1fr}
}
@media print{
  .sidebar,.bottom-nav,.toolbar-actions,.topbar-mobile-user,.icon-btn{display:none!important}
  body{background:#fff}
  .card,.stat{box-shadow:none}
  .page{padding:0}
}
</style>
